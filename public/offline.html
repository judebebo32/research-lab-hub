<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f4d3a" />
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f1; color: #1d2420;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #e3e1da; border-radius: 14px; padding: 2rem; max-width: 380px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font: 600 1.3rem Georgia, serif; margin: .8rem 0 .4rem; }
  p { color: #69716c; margin: 0 0 1.2rem; }
  button { font: inherit; font-weight: 600; background: #1f4d3a; color: #fff; border: 0; border-radius: 8px; padding: .65rem 1.2rem; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Lab data isn't stored on your phone, so the hub needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
